plugins { id 'com.android.application' }
android {
    namespace 'app.sofaremote'
    compileSdk 35
    defaultConfig { applicationId 'app.sofaremote'; minSdk 26; targetSdk 35; versionCode 8; versionName '0.3.5'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    signingConfigs {
        release {
            if (System.getenv('SOFA_STORE_PASSWORD')) {
                storeFile file('release.p12')
                storeType 'PKCS12'
                storePassword System.getenv('SOFA_STORE_PASSWORD')
                keyAlias 'sofa'
                keyPassword System.getenv('SOFA_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
