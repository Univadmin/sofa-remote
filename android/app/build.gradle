plugins { id 'com.android.application' }
android {
    namespace 'app.sofaremote'
    compileSdk 35
    defaultConfig { applicationId 'app.sofaremote'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.3.0' }
    signingConfigs {
        release {
            if (System.getenv('SOFA_STORE_PASSWORD')) {
                storeFile file('release.p12')
                storeType 'PKCS12'
                storePassword System.getenv('SOFA_STORE_PASSWORD')
                keyAlias 'sofa'
                keyPassword System.getenv('SOFA_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
