name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js && node --check browser/background.js && node --test tests/gestures.test.cjs tests/browser.test.cjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signing
        if: github.event_name != 'pull_request'
        env:
          STORE: ${{ secrets.SOFA_SIGNING_STORE }}
        run: printf '%s' "$STORE" | base64 --decode > android/app/release.p12
      - name: Build APK
        if: github.event_name != 'pull_request'
        env:
          SOFA_STORE_PASSWORD: ${{ secrets.SOFA_STORE_PASSWORD }}
        run: |
          gradle -p android testDebugUnitTest assembleRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/SofaRemote-Android.apk
      - name: Test pull request
        if: github.event_name == 'pull_request'
        run: gradle -p android testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Sofa-Remote-Android
          path: dist/SofaRemote-Android.apk
  android-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start isolated remote server
        run: PYTHONPATH=. python tests/android_smoke_server.py > /tmp/sofa-android.log 2>&1 &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/test-android-interaction.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-interaction-results
          path: |
            android/app/build/reports/androidTests/connected/
            android-interaction-screenshots/
            android-interaction-logcat.txt
            android-interaction-server.log
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: python tests/windows_focus_smoke.py
        env:
          PYTHONPATH: .
      - run: pyinstaller --noconfirm --onefile --name SofaRemote --collect-all aiohttp --add-data "web;web" run.py
      - run: pyinstaller --noconfirm --onefile --name UpdateFixture --paths . tests/windows_update_fixture.py
      - run: python tests/windows_runtime_smoke.py
        env:
          PYTHONPATH: .
      - name: Verify packaged server
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/SofaRemote.exe -ArgumentList '--dry-run','--host','127.0.0.1','--port','18765','--state-dir',"$env:RUNNER_TEMP/sofa-state" -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $info = Invoke-RestMethod http://127.0.0.1:18765/api/info
                if ($info.service -eq 'sofa-remote') { $ready = $true; break }
              } catch {}
            }
            if (!$ready) { throw 'Packaged server did not start' }
            $page = Invoke-WebRequest http://127.0.0.1:18765/
            if ($page.StatusCode -ne 200) { throw 'Web UI missing' }
          } finally { Stop-Process -Id $process.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: Sofa-Remote-Windows
          path: dist/SofaRemote.exe
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd browser && zip -r ../SofaRemote-Browser.zip manifest.json background.js focus.js
      - uses: actions/upload-artifact@v4
        with:
          name: Sofa-Remote-Browser
          path: SofaRemote-Browser.zip
